<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TDL Settings</title>
<style>
  :root { color-scheme: dark; --bg:#0b0b0f; --panel:#141319; --raised:#1d1b22; --line:#453b2b; --gold:#d8b46a; --text:#e6e6e6; --muted:#aaa7a3; --bad:#e58e83; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
  button,input,select,textarea { font:inherit; }
  button { cursor:pointer; }
  :focus-visible { outline:2px solid var(--gold); outline-offset:2px; }
  .shell { max-width:1280px; margin:auto; padding:26px 28px 100px; }
  header { display:flex; align-items:end; justify-content:space-between; gap:20px; border-bottom:1px solid var(--line); padding-bottom:19px; }
  h1 { margin:0; color:var(--gold); font:normal 38px/1.05 Georgia,serif; letter-spacing:.02em; }
  .subtitle { color:var(--muted); margin:6px 0 0; }
  .status { color:var(--muted); min-height:22px; text-align:right; }
  .status.dirty { color:var(--gold); }
  nav { display:flex; gap:4px; overflow-x:auto; padding:16px 0; border-bottom:1px solid var(--line); }
  nav button { flex:none; background:transparent; border:0; border-bottom:2px solid transparent; color:var(--muted); padding:9px 13px; white-space:nowrap; }
  nav button[aria-selected="true"] { color:var(--gold); border-color:var(--gold); }
  main { padding-top:22px; }
  h2 { margin:0 0 14px; font:normal 23px Georgia,serif; color:var(--gold); }
  h3 { margin:0 0 12px; font-size:15px; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:19px; min-width:0; }
  .card.wide { grid-column:1/-1; }
  .field { display:grid; grid-template-columns:minmax(150px,1fr) minmax(150px,1.6fr); gap:12px; align-items:center; margin:10px 0; }
  .field > label,.field > span:first-child { color:var(--text); }
  .hint { color:var(--muted); font-size:12px; margin:4px 0 10px; }
  .field .hint,.check .hint { display:block; margin:2px 0 0; }
  input:not([type=checkbox]):not([type=radio]):not([type=range]),select,textarea { width:100%; min-width:0; color:var(--text); background:var(--raised); border:1px solid #5a5040; border-radius:5px; padding:8px 10px; }
  input:disabled { opacity:.65; }
  textarea { resize:vertical; min-height:38px; }
  input[type=checkbox],input[type=radio] { accent-color:var(--gold); width:16px; height:16px; vertical-align:middle; }
  input[type=range] { width:100%; accent-color:var(--gold); }
  .check { display:flex; align-items:start; gap:8px; }
  .inline { display:flex; gap:15px; flex-wrap:wrap; align-items:center; }
  .row { display:grid; grid-template-columns:minmax(120px,1fr) minmax(180px,2fr) auto; gap:8px; align-items:start; margin:8px 0; }
  .row.four { grid-template-columns:minmax(120px,1fr) minmax(180px,2fr) minmax(90px,.5fr) auto; }
  .row.two { grid-template-columns:minmax(140px,1fr) minmax(120px,1fr) auto; }
  .row-head { color:var(--muted); font-size:12px; margin:0 0 6px; }
  .action-editor { display:flex; gap:6px; align-items:start; min-width:0; }
  .action-editor select { width:auto; max-width:100%; }
  .action-editor .action-main { flex:1; min-width:0; }
  .action-editor input[type=number] { width:72px !important; }
  .action-editor textarea { min-width:150px; }
  .action-editor .multi { display:flex; gap:6px; flex-wrap:wrap; flex:1; }
  .action-editor .multi select { min-width:155px; }
  .action-editor .mini { padding:5px 9px; }
  .pick-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:4px 16px; }
  .pick-group { margin:0 0 8px; min-width:0; }
  .pick-group summary { color:var(--gold); cursor:pointer; }
  .pick-group .checks { padding:6px 0 7px 14px; display:grid; gap:4px; }
  .pick-group label { display:flex; gap:7px; align-items:start; overflow-wrap:anywhere; }
  .quiet,.mini { color:var(--gold); background:transparent; border:1px solid var(--line); border-radius:5px; padding:7px 11px; }
  .mini { padding:7px 10px; }
  .quiet:hover,.mini:hover { background:#2a241c; }
  .danger { color:var(--bad); }
  .tier { border-top:1px solid var(--line); padding:13px 0; }
  .tier:first-child { border-top:0; }
  .tier-top { display:grid; grid-template-columns:minmax(210px,auto) 1fr auto; gap:8px; align-items:start; }
  .tier-threshold { display:flex; align-items:center; gap:6px; white-space:nowrap; }
  .tier-threshold input { width:70px !important; min-width:64px !important; }
  .part { display:grid; grid-template-columns:minmax(130px,1fr) minmax(150px,2fr) minmax(250px,2fr) auto; gap:7px; margin:8px 0 8px 98px; align-items:start; }
  .part-count { display:flex; gap:5px; align-items:center; flex-wrap:wrap; }
  .part-count select { width:auto; max-width:100%; min-width:0; }
  .part-count label { display:flex; gap:4px; align-items:center; white-space:nowrap; }
  .part-count input { width:64px !important; min-width:64px !important; }
  .tier-preview { margin:0; line-height:1.6; }
  details.text-group { border:1px solid var(--line); background:var(--panel); border-radius:8px; margin:0 0 12px; padding:12px 18px; }
  details.text-group summary { cursor:pointer; color:var(--gold); font:normal 21px Georgia,serif; }
  .advanced-section { margin-bottom:14px; }
  .toolbar { position:fixed; bottom:0; left:0; right:0; background:rgba(11,11,15,.97); border-top:1px solid var(--line); padding:12px 28px; display:flex; justify-content:flex-end; gap:9px; z-index:10; }
  .primary { background:var(--gold); color:#16120d; border:1px solid var(--gold); border-radius:5px; padding:8px 16px; font-weight:700; }
  .primary:disabled { opacity:.5; cursor:default; }
  #toast { position:fixed; right:28px; bottom:74px; background:#28231d; color:var(--text); border:1px solid var(--gold); border-radius:6px; padding:11px 15px; max-width:460px; z-index:20; box-shadow:0 8px 30px #0009; }
  #toast[hidden] { display:none; }
  @media(max-width:950px) { .shell { padding:20px 16px 92px; } .grid { grid-template-columns:1fr; } .pick-grid { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media(max-width:650px) { header { display:block; } .status { text-align:left; margin-top:10px; } .field { grid-template-columns:1fr; gap:3px; } .row,.row.four,.row.two,.tier-top,.part { grid-template-columns:1fr; } .part { margin-left:18px; border-left:1px solid var(--line); padding-left:10px; } .pick-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>

    draw();box.append(button(t('add'),()=>{ensure('RaidTiers').entries.push({key:'',value:IDS[0]});changed();draw();}));return drawPreview;}
  function pools(parent,onChange){const box=card(parent,sectionLabel('RaidPools'),true),list=node('div');box.append(list);function draw(){list.replaceChildren();ensure('RaidPools').entries.forEach((e,i)=>{const wrap=node('div','tier'),name=input(e.key);name.addEventListener('input',()=>{e.key=name.value;changed();onChange();});wrap.append(field(node('div'),t('title'),name));wrap.append(actionChecks(e.value,v=>{e.value=v;changed();onChange();}));wrap.append(button(t('delete'),()=>{section('RaidPools').entries.splice(i,1);changed();draw();onChange();},'mini danger'));list.append(wrap);});}draw();box.append(button(t('add'),()=>{ensure('RaidPools').entries.push({key:'',value:''});changed();draw();onChange();}));}
  function renderRaids(root){const grid=node('div','grid');root.append(grid);const c=card(grid,sectionLabel('Events'),true);ensure('Events').entries.forEach(e=>{if(['RaidMinViewers','GiftSubPerGift','GiftSubMax'].includes(e.key))textField(c,'Events',e.key,e.key,'number');else field(c,e.key,actionEditor(e.value,v=>set('Events',e.key,v)),`Events.${e.key}`);});pools(grid,tiers(grid));mappingRows(grid,'RaidNotices',sectionLabel('RaidNotices'),{text:true,numeric:true,wide:true});const scale=card(grid,sectionLabel('RaidScaling'),true);checkField(scale,'RaidScaling','Enabled');textField(scale,'RaidScaling','DragonMinLevel','DragonMinLevel','number');const list=node('div');scale.append(list);function draw(){list.replaceChildren();ensure('RaidScaling').entries.filter(e=>!['Enabled','DragonMinLevel'].includes(e.key)).forEach(e=>{const row=node('div','row two'),key=input(e.key,'number'),val=input(e.value,'number'),keyBox=node('div');let name=caption(`RaidScaling.${e.key}`,e.key);add(keyBox,name,key);key.addEventListener('input',()=>{e.key=key.value;const next=caption(`RaidScaling.${e.key}`,e.key);name.replaceWith(next);name=next;changed();});val.step='any';val.addEventListener('input',()=>{e.value=val.value;changed();});add(row,keyBox,val,button('×',()=>{remove('RaidScaling',e.key);draw();},'mini danger'));list.append(row);});}draw();scale.append(button(t('add'),()=>{ensure('RaidScaling').entries.push({key:'',value:'1'});changed();draw();}));}
  function renderTexts(root){root.append(node('p','hint',t('textHint')));[['Messages',sectionLabel('Messages')],['ChatReplies',sectionLabel('ChatReplies')]].forEach(([name,label],index)=>{const d=node('details','text-group');d.open=index===0;d.append(node('summary',null,label));ensure(name).entries.forEach(e=>textField(d,name,e.key,IDS.includes(e.key)?actionName(e.key):e.key));if(name==='Messages')IDS.filter(id=>!entry('Messages',id)).forEach(id=>textField(d,'Messages',id,actionName(id)));root.append(d);});}
  function renderAdvanced(root){root.append(node('p','hint',t('advancedHint')));config.sections.forEach((s,si)=>{const box=node('section','card advanced-section'),head=node('div','inline'),title=input(s.name);title.setAttribute('aria-label',t('section'));title.title=sectionLabel(s.name);title.addEventListener('input',()=>{s.name=title.value;title.title=sectionLabel(s.name);changed();});add(head,node('h2',null,t('section')),title,button(t('delete'),()=>{config.sections.splice(si,1);changed();render();},'mini danger'));box.append(head);s.entries.forEach((e,i)=>{const row=node('div','row two'),key=input(e.key),value=input(e.value);key.setAttribute('aria-label',t('key'));key.title=fieldLabel(`${s.name}.${e.key}`,e.key);value.setAttribute('aria-label',t('value'));key.addEventListener('input',()=>{e.key=key.value;key.title=fieldLabel(`${s.name}.${e.key}`,e.key);changed();});value.addEventListener('input',()=>{e.value=value.value;changed();});add(row,key,value,button('×',()=>{s.entries.splice(i,1);changed();render();},'mini danger'));box.append(row);});box.append(button(t('addKey'),()=>{s.entries.push({key:'',value:''});changed();render();},'quiet'));root.append(box);});root.append(button(t('addSection'),()=>{config.sections.push({name:'',entries:[]});changed();render();},'quiet'));}
  function render(){document.documentElement.lang=lang;$('subtitle').textContent=t('subtitle');$('save').textContent=t('save');$('reload').textContent=t('reload');const nav=$('tabs');nav.replaceChildren();tabs.forEach(name=>{const b=node('button',null,t(name));b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',name===active?'true':'false');b.addEventListener('click',()=>{active=name;render();});nav.append(b);});const root=$('content');root.replaceChildren();({main:renderMain,rewards:renderRewards,chat:renderChat,polls:renderPolls,raids:renderRaids,texts:renderTexts,advanced:renderAdvanced})[active](root);changed();}
  function numeric(value,positive=false){return /^\d+$/.test(value)&&(!positive||Number(value)>0);}
  function validate(){const seenSections=new Set();for(const s of config.sections){if(!s.name||/[\r\n\[\]]/.test(s.name))return `${t('invalidSection')}: ${s.name}`;if(seenSections.has(s.name))return `${t('duplicate')}: [${s.name}]`;seenSections.add(s.name);const keys=new Set();for(const e of s.entries){const where=`[${s.name}] ${e.key}`;if(!e.key)return `${t('empty')}: ${where}`;if(/[\r\n]/.test(e.value)||/[\r\n]/.test(e.key))return `${t('badLine')}: ${where}`;if(/[=]/.test(e.key)||/^[;\[]/.test(e.key))return `${t('badKey')}: ${where}`;if(keys.has(e.key))return `${t('duplicate')}: ${where}`;keys.add(e.key);if(s.name==='Chat'&&!e.key.startsWith('!'))return `${t('badCommand')}: ${where}`;if(['Bits','RaidTiers','RaidNotices'].includes(s.name)&&!numeric(e.key))return `${t('number')}: ${where}`;if(s.name==='RaidScaling'&&!['Enabled','DragonMinLevel'].includes(e.key)&&(!numeric(e.key)||!Number.isFinite(Number(e.value))))return `${t('number')}: ${where}`;if(s.name==='RaidTiers'){const parts=parseTier(e.value);if(parts){for(const p of parts){if(p.kind==='pool'&&!entry('RaidPools',p.target))return `${t('badPool')}: ${where}`;if(p.kind==='list'&&!p.target.split(',').map(x=>x.trim()).every(x=>IDS.includes(x)))return `${t('badPool')}: ${where}`;if(p.mode!=='once'){if(!numeric(p.a,true)||!numeric(p.b,true)||Number(p.a)>50||Number(p.b)>50)return `${t('countError')}: ${where}`;if(p.mode==='range'&&Number(p.a)>Number(p.b))return `${t('rangeError')}: ${where}`;}}}}if(['Rewards','Bits','Chat','Poll','Events'].includes(s.name)){const a=parseAction(e.value);if(a.mode==='burst'&&(!numeric(a.count,true)||Number(a.count)>50))return `${t('countError')}: ${where}`;}}}return '';}
  async function load(){try{let data;if(MOCK){data=JSON.parse($('sample-config').textContent);}else{const r=await fetch('/api/config',{headers:{'X-TDL-Token':TOKEN},cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);data=await r.json();}if(!data||!Array.isArray(data.sections))throw Error('Invalid response');config=copy(data);lang=data.lang==='ru'?'ru':'en';baseline=JSON.stringify(config.sections);render();}catch(e){toast(t('loadError')+e.message,true);}}
  async function save(){const error=validate();if(error){toast(t('invalid')+error,true);return;}const body=JSON.stringify({sections:config.sections});if(new TextEncoder().encode(body).length>256*1024){toast(t('saveError')+'256 KB limit',true);return;}try{if(MOCK){console.log('POST /api/config',body);}else{const r=await fetch('/api/config',{method:'POST',headers:{'X-TDL-Token':TOKEN,'Content-Type':'application/json'},body});const result=await r.json().catch(()=>({}));if(!r.ok||!result.ok)throw Error(result.error||`HTTP ${r.status}`);}baseline=JSON.stringify(config.sections);changed();toast(t(MOCK?'mockOk':'saveOk'));}catch(e){toast(e instanceof TypeError?t('noGame'):t('saveError')+e.message,true);}}
  $('save').addEventListener('click',save);$('reload').addEventListener('click',()=>{if(config&&JSON.stringify(config.sections)!==baseline&&!confirm(t('reloadAsk')))return;load();});window.addEventListener('beforeunload',e=>{if(config&&JSON.stringify(config.sections)!==baseline){e.preventDefault();e.returnValue=t('leaveAsk');}});
  // ASVS 1.2.1: render all config values with textContent/value; 2.2.1: validate before POST (server validates again).
  load();
})();
</script>
