; Replies in Twitch chat. Empty value = no message. {user} {trigger} {pos} {eta} {refund}
[ChatReplies]
Enabled=1
; queued, fires in 5+ seconds
Queued=@{user}, {trigger}: в очереди #{pos}, ~{eta} с
; fires right away (in-game message is enough by default)
Now=
Dropped=@{user}, {trigger}: очередь переполнена, попробуй позже. {refund}
Evicted=@{user}, {trigger}: вытеснено более ценным действием. {refund}
Refunded=Баллы возвращены.
HelpCommand=!tdl
; Viewer stats and voting replies. {user} = display name; {top} = ranking; {actions}/{bits}/{redemptions} = totals.
Top=TDL top: {top}
Me=@{user} TDL: {actions} actions, {bits} bits, {redemptions} redemptions
; Auto-poll templates: {options}, {choices}, {seconds}, {winner}, {counts}
AutoPollStart=Голосование: {options} - пишите !1..!{choices} ({seconds} с)
AutoPollNoVotes=TDL: нет голосов
AutoPollWin=TDL: победило {winner} ({counts})
AutoPollCanceled=TDL: голосование отменено
Paused=@{user}, TDL paused. {refund}
PausedHeld=@{user}, TDL на паузе, команда в очереди
Blocked=@{user}, that action is blocked. {refund}
TooMany=@{user}, you already have too many actions queued. {refund}
Help=Награды: {rewards} | Биты: {bits} | Команды: {commands}

; Overlay for OBS: add a Browser Source with URL http://127.0.0.1:8645/ (size 440x600)
[Overlay]
Enabled=1
Port=8645
; 0 = hide the Top viewers card while keeping stats/chat commands enabled
ShowTop=1
; Recent items older than this many minutes are omitted from /state; 0 = keep all
RecentMinutes=10
; 0 = hide the Recent card
ShowRecent=1
; Play one cue when a new action appears in Recent (maximum once per second).
Sound=1
SoundVolume=60
; Optional .mp3, .wav or .ogg file beside TDL_Overlay.html; empty = generated chime.
SoundFile=
; In OBS, enable "Control audio via OBS" on the Browser source to hear and mix the cue.

; Viewer activity is stored beside the Twitch token in Documents\My Games\Skyrim Special Edition\SKSE.
[Stats]
Enabled=1
; 1 = start with empty stats (overwrites the previous file on the first save)
ResetOnStart=0

; EventSub raids, subscriptions, gifted subscriptions and hype trains. Empty mapping = ignore.
; Mappings use the same ACTION / A, B, C syntax as [Rewards].
[Events]
Raid=SUMMON_ANY
; Minimum viewers required for a raid. [RaidTiers] takes precedence over Raid when populated.
RaidMinViewers=1
Sub=SYSTEM_BLESSING
Resub=SYSTEM_BLESSING
GiftSub=SUMMON_ANY
; 1 = trigger per gifted subscription, up to GiftSubMax
GiftSubPerGift=0
GiftSubMax=5
HypeTrainBegin=WEATHER_STORM
HypeTrainLevel=SUMMON_STRONG

; RANDOM(poolName) draws from a named, case-insensitive pool.
[RaidPools]
wrath = WRATH_11, WRATH_12, WRATH_13

; Highest threshold <= viewers wins; hot reloaded. '+' runs all parts, ',' picks one group.
; Part: ACTION, FORCE1|ACTION, ACTION|MIN|MAX, ACTION|/N|MAX, or RANDOM(ACTION,ACTION)/RANDOM(poolName) with the same count suffix.
; MIN..MAX grows to the next threshold; /N uses viewers/N (min 1). Counted parts scale by player level. Total summons capped at 50.
[RaidTiers]
; Test as broadcaster/mod: !tdl raid <viewers> [name] (or !tdl_raid); uses live raid rules.
1=FORCE1|SYSTEM_HEALING + SUMMON_SKELETON|1|10
11=FORCE1|SYSTEM_HEALING + SUMMON_ANIMAL|3|10
31=FORCE1|SYSTEM_HEALING + SUMMON_HUMANOID|3|10 + SUMMON_UNDEAD|1|5
71=FORCE1|SYSTEM_HEALING + SUMMON_UNDEAD|5|10 + SUMMON_STRONG|1|5 + WRATH_11
121=FORCE1|SYSTEM_HEALING + SUMMON_STRONG|5|10 + RANDOM(wrath)|1|1
201=FORCE1|SYSTEM_HEALING + FORCE1|SYSTEM_BLESSING + SUMMON_DRAGON|/30|10 + SUMMON_STRONG|/50|8 + RANDOM(wrath)|1|2

[RaidNotices]
201=Ваш чат помогает и благословляет вас!

[RaidScaling]
Enabled=1
; player level threshold = multiplier for counts (creatures and RANDOM counts)
1=0.5
11=0.75
31=1.0
51=1.25
76=1.5
; below this level SUMMON_DRAGON parts are replaced by SUMMON_STRONG (0 = no limit)
DragonMinLevel=20

; Chat voting works on any Twitch account, independent of native Twitch polls.
[AutoPoll]
Enabled=0
IntervalMin=10
DurationSec=60
Choices=3
; Distinct safe actions; [Safety] Blocked entries are removed automatically.
Pool=WEATHER_STORM, SUMMON_ANIMAL, GIGANT_SMALL, SYSTEM_HEALING, SUMMON_SKELETON, WEATHER_RAIN
MinVotes=1
