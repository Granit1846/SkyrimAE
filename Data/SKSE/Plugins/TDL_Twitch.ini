; TDL - native Twitch integration (no Streamer.bot needed)
; File must be saved as UTF-8. Changes apply while the game is running.
;
; Value of every mapping:
;   ACTION              - one action, e.g. SUMMON_DRAGON
;   A, B, C             - random one from the list (difficulty tiers)
;   FORCE|ACTION|COUNT  - burst, same syntax as the pipe protocol
;
; First launch: the game shows a code and opens twitch.tv/activate - log in with the streaming account.
; To log out, delete Documents\My Games\Skyrim Special Edition\SKSE\TDL_Twitch.token

[Twitch]
Enabled=1
; 1 = stop Twitch actions and refund incoming channel point redemptions; hot reloadable
Paused=0
; cancel = reject incoming Twitch actions and cancel queued ones while paused (default).
; hold = accept Twitch actions into the limited queue and run them after resume; local pipe actions keep running.
; Changing this while paused from hold to cancel refunds held channel point redemptions. Hot reloadable.
PauseMode=cancel
; 0 = chat commands only from the broadcaster and moderators, 1 = from everyone
ChatAllowEveryone=0
; 1 = show a message in the top-left corner when an action fires (text from [Messages])
Notify=1
; Name used in messages for poll results (polls have no single viewer)
PollName=Чат
; 1 = create the [Rewards] on your channel (needs Affiliate/Partner). Only rewards created this way
; can be refunded automatically when the queue is full - Twitch does not allow it for hand-made rewards.
CreateRewards=1
; Testing without a stream: Twitch CLI "twitch event websocket start-server"
MockServer=0
MockUrl=ws://127.0.0.1:8080/ws

; Twitch actions only. Pipe and local commands are unaffected.
[Safety]
Blocked=VIRUS_WEREWOLF, VIRUS_VAMPIRE, INVENTORY_DROP_ALL
; 1 = permit FORCE and FORCE1 in viewer reward, bits, and poll mappings
AllowForceFromViewers=0

[AntiSpam]
; Minimum seconds between accepted chat commands from a viewer (broadcaster/moderators exempt)
UserCooldownSec=20
; Maximum actions waiting per Twitch user across rewards and chat
MaxQueuedPerUser=2
; Identical chat command from the same user is ignored silently for this many seconds
IgnoreDuplicateSec=5
; 1 = bits do not count toward MaxQueuedPerUser
ExemptBits=1

; Channel Points rewards: exact reward title = action (requires Affiliate/Partner)
; Unsafe actions excluded from default mappings: INVENTORY_DROP_ALL, VIRUS_WEREWOLF, VIRUS_VAMPIRE.
[Rewards]
TDL: Лёгкое испытание=WEATHER_CLEAR, WEATHER_RAIN, WEATHER_SNOW, WEATHER_FOG, SUMMON_SKELETON, SUMMON_ANIMAL, SYSTEM_HEALING, TELEPORT_RANDOM_CITY, TELEPORT_WHITERUN, TELEPORT_SOLITUDE, TELEPORT_WINDHELM, TELEPORT_RIFTEN, TELEPORT_MARKARTH, TELEPORT_FALKREATH, TELEPORT_DAWNSTAR, TELEPORT_HIGH_HROTHGAR
TDL: Среднее испытание=SUMMON_ANY, SUMMON_HUMANOID, SUMMON_UNDEAD, WEATHER_STORM, CHAOS_LOW_G, GIGANT_SMALL, GIGANT_SLOW, INVENTORY_SCATTER, VIRUS_DISEASE, SYSTEM_BLESSING, TELEPORT_RANDOM_DANGER
TDL: Тяжёлое испытание=SUMMON_STRONG, WRATH_11, WRATH_12, WRATH_13, CHAOS_BACKFIRE, GIGANT_BIG, GIGANT_SPEED, COMEDY_FAKE_HERO, COMEDY_HORROR, COMEDY_ESCORT
TDL: Эпическое испытание=SUMMON_DRAGON, HUNTER_START, COMEDY_ARENA

; Cost in channel points for rewards created by CreateRewards=1
[RewardCosts]
TDL: Лёгкое испытание=500
TDL: Среднее испытание=1500
TDL: Тяжёлое испытание=4000
TDL: Эпическое испытание=10000

; Bits: minimum amount = action (the largest threshold not above the cheer wins)
[Bits]
100=WEATHER_CLEAR, WEATHER_RAIN, WEATHER_SNOW, WEATHER_FOG, SUMMON_SKELETON, SUMMON_ANIMAL, SYSTEM_HEALING, TELEPORT_RANDOM_CITY
500=SUMMON_ANY, SUMMON_HUMANOID, SUMMON_UNDEAD, WEATHER_STORM, CHAOS_LOW_G, GIGANT_SMALL, GIGANT_SLOW, INVENTORY_SCATTER, VIRUS_DISEASE, SYSTEM_BLESSING, TELEPORT_RANDOM_DANGER
1000=SUMMON_STRONG, WRATH_11, WRATH_12, WRATH_13, CHAOS_BACKFIRE, GIGANT_BIG, GIGANT_SPEED, COMEDY_FAKE_HERO, COMEDY_HORROR, COMEDY_ESCORT
2500=SUMMON_DRAGON, HUNTER_START, COMEDY_ARENA

; Chat commands (works on any account, no Affiliate needed). Command = action
[Chat]
!tdl_ping=SYSTEM_PING
!tdl_heal=SYSTEM_HEALING
!tdl_weather_reset=WEATHER_RESET
!tdl_size_reset=GIGANT_RESET

; Polls: winning choice title = action
[Poll]
Дракон=SUMMON_DRAGON
Охотник=HUNTER_START
Арена=COMEDY_ARENA

